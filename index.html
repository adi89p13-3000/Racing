
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO CAP RACER 🏎️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #090914;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

h1 {
    color: #00f7ff;
    margin: 12px 0 5px;
    text-shadow: 0 0 15px #00f7ff;
}

.subtitle {
    color: #ff4de1;
    font-size: 13px;
    margin-bottom: 10px;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 10px;
    font-weight: bold;
}

.stats span {
    color: #00f7ff;
}

#game {
    display: block;
    margin: auto;
    width: min(94vw, 380px);
    height: min(66vh, 560px);
    border: 2px solid #00f7ff;
    border-radius: 12px;
    box-shadow: 0 0 20px #00f7ff55;
    background: #252535;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 12px;
}

button {
    background: #17172b;
    border: 2px solid #ff4de1;
    color: white;
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

button:active {
    background: #ff4de1;
    transform: scale(.95);
}

#message {
    color: #ffe66d;
    min-height: 22px;
    font-weight: bold;
    margin: 6px;
}

#start {
    background: #00c9a7;
    border: none;
    color: #090914;
}

</style>
</head>

<body>

<h1>🏎️ NO CAP RACER</h1>
<p class="subtitle">Main Character Energy Only 💀</p>

<div class="stats">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
</div>

<canvas id="game" width="380" height="560"></canvas>

<div id="message">Bro, ready to cook? 🔥</div>

<div class="controls">
    <button id="left">⬅️</button>
    <button id="start">RUN IT BACK ▶</button>
    <button id="right">➡️</button>
</div>

<p class="subtitle">Arrow Keys / A-D to move • Space = Boost</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const message = document.getElementById("message");

const W = canvas.width;
const H = canvas.height;

let player, traffic, score, speed, roadLine;
let running = false;
let gameOver = false;
let boost = false;
let frame = 0;

let best = Number(localStorage.getItem("vibeRacerBest")) || 0;
bestText.textContent = best;

const lanes = [65, 125, 185, 245, 305];

const phrases = [
    "NO CAP, CLEAN DRIVE 😎",
    "MAIN CHARACTER ENERGY ✨",
    "NPC TRAFFIC AHEAD 💀",
    "BRO IS COOKING 🔥",
    "ABSOLUTE CINEMA 🎬",
    "AURA +1000 ⚡",
    "SKILL ISSUE? NOT TODAY 😤",
    "COLLECT THAT W 🏆"
];

function resetGame() {
    player = {
        x: 180,
        y: 455,
        w: 34,
        h: 62
    };

    traffic = [];
    score = 0;
    speed = 4;
    roadLine = 0;
    frame = 0;

    scoreText.textContent = "0";
    message.textContent = "LOCK IN. NO DISTRACTIONS 🗿";

    running = true;
    gameOver = false;

    requestAnimationFrame(loop);
}

function drawCar(x, y, color, isPlayer = false) {
    // Car body
    ctx.fillStyle = color;
    ctx.fillRect(x, y + 8, 34, 46);

    // Front and rear shape
    ctx.fillRect(x + 5, y, 24, 12);
    ctx.fillRect(x + 5, y + 48, 24, 10);

    // Windows
    ctx.fillStyle = "#151525";
    ctx.fillRect(x + 6, y + 15, 22, 12);
    ctx.fillRect(x + 6, y + 32, 22, 10);

    // Wheels
    ctx.fillStyle = "#050509";
    ctx.fillRect(x - 4, y + 12, 5, 14);
    ctx.fillRect(x + 33, y + 12, 5, 14);
    ctx.fillRect(x - 4, y + 39, 5, 14);
    ctx.fillRect(x + 33, y + 39, 5, 14);

    if (isPlayer) {
        ctx.fillStyle = "#00f7ff";
        ctx.fillRect(x + 4, y + 2, 7, 4);
        ctx.fillRect(x + 23, y + 2, 7, 4);

        if (boost) {
            ctx.fillStyle = "#ff4de1";
            ctx.fillRect(x + 7, y + 58, 6, 13);
            ctx.fillRect(x + 21, y + 58, 6, 13);
        }
    } else {
        ctx.fillStyle = "#ff334f";
        ctx.fillRect(x + 4, y + 51, 8, 4);
        ctx.fillRect(x + 22, y + 51, 8, 4);
    }
}

function drawRoad() {
    ctx.fillStyle = "#20202c";
    ctx.fillRect(0, 0, W, H);

    // Road edges
    ctx.fillStyle = "#00f7ff";
    ctx.fillRect(12, 0, 4, H);
    ctx.fillRect(W - 16, 0, 4, H);

    // Moving lane markers
    ctx.fillStyle = "#777788";

    for (let y = -40; y < H; y += 90) {
        ctx.fillRect(94, y + roadLine, 4, 42);
        ctx.fillRect(154, y + roadLine, 4, 42);
        ctx.fillRect(214, y + roadLine, 4, 42);
        ctx.fillRect(274, y + roadLine, 4, 42);
    }

    roadLine += speed;

    if (roadLine >= 90) roadLine = 0;
}

function spawnTraffic() {
    const colors = ["#ff4de1", "#ffbd35", "#7c5cff", "#53ff75"];

    const lane = Math.floor(Math.random() * lanes.length);

    traffic.push({
        x: lanes[lane] - 17,
        y: -75,
        w: 34,
        h: 62,
        color: colors[Math.floor(Math.random() * colors.length)]
    });
}

function collision(a, b) {
    return (
        a.x + 5 < b.x + b.w - 5 &&
        a.x + a.w - 5 > b.x + 5 &&
        a.y + 7 < b.y + b.h - 7 &&
        a.y + a.h - 7 > b.y + 7
    );
}

function endGame() {
    running = false;
    gameOver = true;

    message.textContent = "BRO GOT COOKED 💀 SCORE: " + score;

    if (score > best) {
        best = score;
        localStorage.setItem("vibeRacerBest", best);
        bestText.textContent = best;
        message.textContent = "NEW HIGH SCORE! ABSOLUTE LEGEND 🏆";
    }

    drawGameOver();
}

function drawGameOver() {
    ctx.fillStyle = "#080815dd";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#ff4de1";
    ctx.font = "bold 30px Arial";
    ctx.fillText("YOU GOT COOKED 💀", W / 2, 240);

    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.fillText("Score: " + score, W / 2, 280);

    ctx.fillStyle = "#00f7ff";
    ctx.fillText("Tap RUN IT BACK", W / 2, 320);
}

function update() {
    if (boost) {
        speed = 8;
    } else {
        speed = Math.min(4 + score / 500, 9);
    }

    if (frame % 48 === 0) {
        spawnTraffic();
    }

    traffic.forEach(car => {
        car.y += speed;
    });

    traffic = traffic.filter(car => car.y < H + 80);

    score += 1;
    scoreText.textContent = score;

    for (const car of traffic) {
        if (collision(player, car)) {
            endGame();
            return;
        }
    }

    if (frame % 300 === 0) {
        message.textContent =
            phrases[Math.floor(Math.random() * phrases.length)];
    }

    frame++;
}

function draw() {
    drawRoad();

    traffic.forEach(car => {
        drawCar(car.x, car.y, car.color);
    });

    drawCar(player.x, player.y, "#00d9ff", true);
}

function loop() {
    if (!running) return;

    update();

    if (!running) return;

    draw();
    requestAnimationFrame(loop);
}

function moveLeft() {
    if (running) player.x = Math.max(22, player.x - 30);
}

function moveRight() {
    if (running) player.x = Math.min(324, player.x + 30);
}

document.addEventListener("keydown", e => {
    if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) {
        e.preventDefault();
    }

    if (!running) return;

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        moveLeft();
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        moveRight();
    }

    if (e.code === "Space") {
        boost = true;
    }
});

document.addEventListener("keyup", e => {
    if (e.code === "Space") boost = false;
});

document.getElementById("left").addEventListener("pointerdown", e => {
    e.preventDefault();
    moveLeft();
});

document.getElementById("right").addEventListener("pointerdown", e => {
    e.preventDefault();
    moveRight();
});

document.getElementById("start").addEventListener("click", resetGame);

// Hold the boost by touching the game canvas
canvas.addEventListener("pointerdown", () => {
    boost = true;
});

window.addEventListener("pointerup", () => {
    boost = false;
});

// Initial screen
player = { x: 180, y: 455, w: 34, h: 62 };
traffic = [];
drawRoad();
drawCar(player.x, player.y, "#00d9ff", true);

ctx.fillStyle = "#080815dd";
ctx.fillRect(0, 0, W, H);

ctx.textAlign = "center";
ctx.fillStyle = "#00f7ff";
ctx.font = "bold 30px Arial";
ctx.fillText("VIBE RACER", W / 2, 245);

ctx.fillStyle = "#ff4de1";
ctx.font = "18px Arial";
ctx.fillText("NO CAP. JUST DRIVE.", W / 2, 280);

ctx.fillStyle = "white";
ctx.font = "15px Arial";
ctx.fillText("Press RUN IT BACK to start", W / 2, 320);
</script>

</body>
</html>
